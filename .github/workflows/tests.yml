name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Import desktop with runtime dependencies only
        run: python -c "import mural_agent.desktop; from mural_agent.planner import Budget; assert Budget(candidates=1).model_dump()['candidates'] == 1"
      - name: Install development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
      - name: Pytest (non-WebEngine suite)
        run: python -m pytest -q -m "not web"
      - name: Pytest (shipped WebEngine interface)
        run: python -m pytest -q -m web
      - name: JavaScript syntax
        run: node --check ui/app.js
      - name: Python byte-compile
        run: python -m compileall -q mural_agent
